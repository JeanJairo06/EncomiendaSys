# =========================================================
# Redis optimizado para Django Channels + WebSockets
# =========================================================


# =========================================================
# Red
# =========================================================

# Escuchar en todas las interfaces
bind 0.0.0.0

# Puerto Redis
port 6379

# Mantener conexiones TCP activas
tcp-keepalive 60

# Cola máxima de conexiones pendientes
tcp-backlog 511


# =========================================================
# Memoria
# =========================================================

# Límite máximo de RAM
maxmemory 256mb

# Política de expulsión:
# eliminar claves menos usadas recientemente
maxmemory-policy allkeys-lru


# =========================================================
# Persistencia RDB
# =========================================================

# Snapshot si:
# 1 cambio en 900 segundos
save 900 1

# 10 cambios en 300 segundos
save 300 10

# 10000 cambios en 60 segundos
save 60 10000

# Archivo snapshot
dbfilename dump.rdb

# Directorio persistente
dir /data


# =========================================================
# Logs
# =========================================================

# Nivel de logging
loglevel notice

# stdout para Docker logs
logfile ""


# =========================================================
# Bases de datos
# =========================================================

# Bases disponibles: 0-15
databases 16

# Ejemplo:
# Channels → redis://redis:6379/1


# =========================================================
# Timeouts
# =========================================================

# No cerrar conexiones inactivas
timeout 0